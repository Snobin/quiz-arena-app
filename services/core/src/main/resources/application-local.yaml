# Outside Docker (IDE or spring-boot:run), read the secrets from deploy/.env. The paths cover a
# working directory of the repo root (IDE run configs) or the module (spring-boot:run); inside the
# container neither file exists, so the import is skipped.
spring:
  config:
    import:
      - optional:file:./deploy/.env[.properties]
      - optional:file:../../deploy/.env[.properties]

# Host-side defaults for runs outside Docker: deploy/compose.ide.yaml publishes Postgres and Valkey
# on these ports. Inside a container, the environment variables set by compose.yaml win.
POSTGRES_PORT: 55432
VALKEY_PORT: 56379

minnal:
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    in.minnal: DEBUG

spring:
  application:
    name: core-service
  profiles:
    # No profile chosen (e.g. Run on main() in the IDE) means local. Docker and prod always set
    # SPRING_PROFILES_ACTIVE explicitly, so this only applies to runs on the developer machine.
    default: local
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:minnal}
    username: ${CORE_DB_USER:core}
    password: ${CORE_DB_PASSWORD}
  flyway:
    # Own schema only (AD-3). The schema is created and owned by the core login in
    # deploy/postgres/init; Flyway never creates schemas.
    schemas: core
    default-schema: core
    create-schemas: false
  data:
    redis:
      host: ${VALKEY_HOST:localhost}
      port: ${VALKEY_PORT:6379}
      password: ${VALKEY_PASSWORD:}
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # Admin CSV upload (Story 3.3): 2 MB. The request limit leaves room for the multipart envelope.
      # Parsed on first access, so the controller checks the role and the rate limit before reading the file.
      resolve-lazily: true
      max-file-size: 2MB
      max-request-size: 2100KB

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        # Public /health body is exactly {"status":"UP"}.
        enabled: false

logging:
  structured:
    format:
      # JSON lines; MDC entries (requestId) become top-level fields.
      console: logstash

minnal:
  internal:
    # Service token for /internal/** (AD-12). Unset = every internal request gets 401.
    token: ${MINNAL_INTERNAL_TOKEN:}
  seed:
    # Read only by the `seed` profile's starter loader.
    file: classpath:seed/kerala-psc-starter.csv
  outbox:
    # Publishes event_outbox rows to Valkey streams (AD-15). Off where Valkey is not available.
    relay-enabled: ${MINNAL_OUTBOX_RELAY_ENABLED:true}
  ratelimit:
    # valkey (default) or memory (tests, where Valkey autoconfiguration is excluded).
    store: valkey
  valkey:
    # Owner prefix for every key this service writes (AD-3). Applied when a story first writes keys.
    key-prefix: "core:"
  jwt:
    # Guest JWT signing (AD-9). Base64 of a PKCS#8 PEM RSA key (>= 2048 bits). Unset under the
    # local/test/it profiles = an ephemeral key (WARN); unset under prod = startup failure.
    signing-key: ${MINNAL_JWT_SIGNING_KEY:}
    # kid of the signing key; blank = the key's RFC 7638 thumbprint.
    key-id: ${MINNAL_JWT_KEY_ID:}
    # Rotation: comma-separated kid=base64(SPKI PEM) pairs, published in the JWKS, never used to sign.
    extra-public-keys: ${MINNAL_JWT_EXTRA_PUBLIC_KEYS:}
  auth:
    # Sign-in (AD-9, Story 2.1). Secrets come from the environment only.
    web-url: ${WEB_URL:http://localhost:5173}
    # Secure cookies; browsers still accept them on http://localhost.
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    # Comma-separated; matched case-insensitively against a verified Google email at every token issue.
    admin-emails: ${ADMIN_EMAILS:}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:5173/api/core/v1/auth/google/callback}
      authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
      token-uri: https://oauth2.googleapis.com/token
      jwks-uri: https://www.googleapis.com/oauth2/v3/certs
      issuer: https://accounts.google.com

spring:
  application:
    name: game-service
  lifecycle:
    # MatchDrain holds the shutdown until live matches finish (AD-19).
    timeout-per-shutdown-phase: 5m
  profiles:
    # No profile chosen (e.g. Run on main() in the IDE) means local. Docker and prod always set
    # SPRING_PROFILES_ACTIVE explicitly, so this only applies to runs on the developer machine.
    default: local
  data:
    redis:
      host: ${VALKEY_HOST:localhost}
      port: ${VALKEY_PORT:6379}
      password: ${VALKEY_PASSWORD:}
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        # Public /health body is exactly {"status":"UP"}.
        enabled: false

logging:
  structured:
    format:
      # JSON lines; MDC entries (requestId) become top-level fields.
      console: logstash

minnal:
  valkey:
    # Owner prefix for every key this service writes (AD-3). Applied when a story first writes keys.
    key-prefix: "game:"
  security:
    # core-service's JWKS (AD-9), fetched lazily on the first token. Compose sets the private-network
    # URL (http://core-service:8081/...); the default suits services run from the IDE.
    jwks-uri: ${MINNAL_JWKS_URI:http://localhost:8081/api/core/v1/auth/jwks}
  # Sent as X-Internal-Token on POST {core.base-url}/internal/question-sets (AD-12). Outside Docker,
  # the local profile imports deploy/.env, whose MINNAL_INTERNAL_TOKEN key resolves this.
  internal:
    token: ${MINNAL_INTERNAL_TOKEN:}
  core:
    base-url: ${MINNAL_CORE_URL:http://localhost:8081}
    question-set-timeout: 2s
  matchmaking:
    tick: 250ms
    widen-after: 4s
    bot-after: 8s
  match:
    # After MATCH_FOUND, before Q1 opens, so clients can subscribe to /topic/match/{matchId}.
    lead-in: 3s
    # The answer window (Scoring.WINDOW). Shortened only by tests.
    window: 15s
    # The window closes this long after the deadline: an answer stamped in time still counts if it
    # reaches the match within this much in-flight delay.
    close-grace: 50ms
    # The pause after each reveal before the next question (none after the last).
    reveal-hold: 2s
    # How long a player whose last session closed has to come back before she forfeits.
    grace: 10s
    # How long shutdown waits for live matches to finish.
    drain-timeout: 5m
  bot:
    # Per question: a uniform delay in [min, max] after the window opens.
    min-delay: 2s
    max-delay: 12s
    correct-probability: 0.65
    silent-probability: 0.10
  ws:
    # Inbound STOMP frames per second per connection (token bucket; CONNECT/DISCONNECT exempt).
    inbound-rate: 10

spring:
  application:
    name: ratings-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:minnal}
    username: ${RATINGS_DB_USER:ratings}
    password: ${RATINGS_DB_PASSWORD}
  flyway:
    # Own schema only (AD-3). The schema is created and owned by the ratings login in
    # deploy/postgres/init; Flyway never creates schemas.
    schemas: ratings
    default-schema: ratings
    create-schemas: false
  data:
    redis:
      host: ${VALKEY_HOST:localhost}
      port: ${VALKEY_PORT:6379}
      password: ${VALKEY_PASSWORD:}
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        # Public /health body is exactly {"status":"UP"}.
        enabled: false

logging:
  structured:
    format:
      # JSON lines; MDC entries (requestId) become top-level fields.
      console: logstash

minnal:
  valkey:
    # Owner prefix for every key this service writes (AD-3). Applied when a story first writes keys.
    key-prefix: "ratings:"

spring:
  application:
    name: ratings-service
  profiles:
    # No profile chosen (e.g. Run on main() in the IDE) means local. Docker and prod always set
    # SPRING_PROFILES_ACTIVE explicitly, so this only applies to runs on the developer machine.
    default: local
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:minnal}
    username: ${RATINGS_DB_USER:ratings}
    password: ${RATINGS_DB_PASSWORD}
  flyway:
    # Own schema only (AD-3). The schema is created and owned by the ratings login in
    # deploy/postgres/init; Flyway never creates schemas.
    schemas: ratings
    default-schema: ratings
    create-schemas: false
  data:
    redis:
      host: ${VALKEY_HOST:localhost}
      port: ${VALKEY_PORT:6379}
      password: ${VALKEY_PASSWORD:}
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        # Public /health body is exactly {"status":"UP"}.
        enabled: false

logging:
  structured:
    format:
      # JSON lines; MDC entries (requestId) become top-level fields.
      console: logstash

minnal:
  streams:
    # The stream consumer and the outbox relay (Story 2.5). Off where Valkey is not available.
    enabled: ${MINNAL_STREAMS_ENABLED:true}
    # A pending entry idle this long is reclaimed and retried (it is dead-lettered at its 5th failed delivery).
    reclaim-idle: ${MINNAL_STREAMS_RECLAIM_IDLE:30s}
  valkey:
    # Owner prefix for every key this service writes (AD-3). Applied when a story first writes keys.
    key-prefix: "ratings:"
  security:
    # core-service's JWKS (AD-9), fetched lazily on the first token. Compose sets the private-network
    # URL (http://core-service:8081/...); the default suits services run from the IDE.
    jwks-uri: ${MINNAL_JWKS_URI:http://localhost:8081/api/core/v1/auth/jwks}

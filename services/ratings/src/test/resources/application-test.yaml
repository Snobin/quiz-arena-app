# Context-load tests run without Docker: no Flyway or Valkey, and the DataSource never connects (the Hikari pool
# is created lazily, on the first query, which these tests never make).
spring:
  datasource:
    password: unused-in-context-load-tests
  autoconfigure:
    exclude:
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration


management:
  health:
    db:
      # The DataSource exists but never connects in these tests, so its health check would report DOWN.
      enabled: false

minnal:
  streams:
    enabled: false

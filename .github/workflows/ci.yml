# CI: every push to any branch runs the backend tests, the web checks and the Compose check.
# No secrets, nothing pushed or deployed. Production deploy is Story 1.2 part 2.
name: CI

on:
  push:
    branches: ['**'] # branches only, not tags
  workflow_dispatch:

permissions:
  contents: read

# One run per ref; a newer push cancels the older run, except on main, where every
# merged commit keeps its result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    # One job per service so the slow game tests run beside core and ratings, not after them.
    # -am also builds the contracts module (and runs its tests) for each service.
    name: backend (${{ matrix.module }})
    strategy:
      fail-fast: false
      matrix:
        module: [core, game, ratings]
    # ubuntu-latest has Docker, which the Testcontainers integration tests need.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test (mvnw verify)
        run: ./mvnw -B verify -pl services/${{ matrix.module }} -am
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report-${{ matrix.module }}
          path: services/${{ matrix.module }}/target/site/jacoco/
          retention-days: 7

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:i18n
      - run: npm run check:tokens
      - run: npm run build:check

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  compose:
    name: compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check-script tests
        run: node --test deploy/*.test.mjs
      - name: Check deploy/compose.yaml
        run: node deploy/check-compose.mjs

# CI: every push to any branch runs the backend tests, the web checks and the Compose check.
# No secrets, nothing pushed or deployed. Production deploy is Story 1.2 part 2.
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# One run per ref; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    # ubuntu-latest has Docker, which core's Testcontainers integration tests need.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test (mvnw verify)
        run: ./mvnw -B verify

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:i18n
      - run: npm run check:tokens
      - run: npm run build:check

  compose:
    name: compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check-script tests
        run: node --test deploy/
      - name: Check deploy/compose.yaml
        run: node deploy/check-compose.mjs

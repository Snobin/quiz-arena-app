# Deploy: after CI passes on main, build and push the three service images (tagged with the commit SHA),
# roll them out on the VPS over SSH, and publish the web build to Cloudflare Pages.
# Never runs for PRs or other branches: it only reacts to a successful CI run of a push to main.
# Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# (variable: CLOUDFLARE_PAGES_PROJECT). See the Deploy section of README.md.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Deploys run one at a time and are never cancelled midway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/snobin
  SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  # Only the newest main commit deploys: a late CI run for an older commit stops here (skipped, not failed).
  gate:
    name: gate
    # Off until the repository variable DEPLOY_ENABLED is 'true' (set it once the VPS and secrets exist).
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      - id: head
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          main_sha=$(git ls-remote "https://x-access-token:${TOKEN}@github.com/${REPO}.git" refs/heads/main | cut -f1)
          if [ "$main_sha" = "$SHA" ]; then echo current=true >> "$GITHUB_OUTPUT"
          else echo "main is at $main_sha, not $SHA: skipping this deploy"; echo current=false >> "$GITHUB_OUTPUT"; fi

  images:
    name: images
    needs: gate
    if: needs.gate.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [core, game, ratings]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/minnal-${{ matrix.service }}:${{ env.SHA }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  server:
    name: server
    needs: [gate, images]
    if: needs.gate.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          : "${VPS_HOST:?VPS_HOST secret is empty}" "${VPS_USER:?VPS_USER secret is empty}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  StrictHostKeyChecking yes\n' \
            "$VPS_HOST" "$VPS_USER" > ~/.ssh/config
      - name: Copy the Compose files (never deploy/.env, which lives on the server)
        run: |
          tar -C deploy --exclude='.env' --exclude='fixtures' --exclude='*.mjs' --exclude='compose.ide.yaml' -czf - . \
            | ssh vps 'mkdir -p ~/minnal/deploy && tar -xzf - -C ~/minnal/deploy'
      - name: Pull and restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          # The job token reaches the server on stdin only; it expires when the job ends.
          printf '%s' "$GHCR_TOKEN" | ssh vps "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh vps bash -s -- "$SHA" <<'REMOTE'
          set -uo pipefail
          cd ~/minnal/deploy
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          test -f .env || { echo "deploy/.env is missing on the server" >&2; exit 1; }
          # A local-style .env would deploy with no TLS: refuse it.
          for line in SPRING_PROFILES_ACTIVE=prod CADDY_HTTP_PORT=80 CADDY_HTTP_TARGET=80; do
            grep -qx "$line" .env || { echo ".env must contain $line" >&2; exit 1; }
          done
          site=$(grep '^CADDY_SITE_ADDRESS=' .env | tail -1 | cut -d= -f2-)
          if [ -z "$site" ] || [ "$site" = ":8080" ]; then echo ".env needs CADDY_SITE_ADDRESS set to the API hostname" >&2; exit 1; fi
          grep -q '^CADDY_HTTPS_BIND=.' .env || { echo ".env must set CADDY_HTTPS_BIND" >&2; exit 1; }
          prev=$(grep '^IMAGE_TAG=' .env | tail -1 | cut -d= -f2-)
          [ -z "$(tail -c1 .env)" ] || echo >> .env
          set_tag() { if grep -q '^IMAGE_TAG=' .env; then sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$1/" .env; else echo "IMAGE_TAG=$1" >> .env; fi; }
          set_tag "$1"
          if docker compose --env-file .env pull core-service game-service ratings-service \
             && docker compose --env-file .env up -d --wait --remove-orphans; then
            docker compose --env-file .env ps
          else
            echo "rollout failed; restoring IMAGE_TAG=${prev:-local}" >&2
            set_tag "${prev:-local}"
            docker compose --env-file .env up -d || true
            exit 1
          fi
          REMOTE

  web:
    name: web
    needs: [gate, images, server]
    if: needs.gate.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    defaults:
      run:
        working-directory: web
    steps:
      - name: Require the web build settings
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          printf '%s' "$VITE_API_BASE_URL" | grep -Eq '^https?://[^/]+$' \
            || { echo "vars.VITE_API_BASE_URL must be an origin like https://api.example.com (no path, no trailing slash)" >&2; exit 1; }
          [ -n "$CLOUDFLARE_PAGES_PROJECT" ] || { echo "vars.CLOUDFLARE_PAGES_PROJECT is empty" >&2; exit 1; }
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build:check
        env:
          # API origin the PWA calls (HTTP and WebSocket), e.g. https://api.example.com
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4 pages deploy dist
          --project-name="${{ vars.CLOUDFLARE_PAGES_PROJECT }}"
          --branch=main --commit-hash="$SHA"

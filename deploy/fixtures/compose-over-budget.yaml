# Fixture for check-compose.test.mjs: limits sum to 3,200,000,000 bytes, exactly at the 3.2 GB budget.
services:
  core-service:
    image: busybox
    restart: unless-stopped
    mem_limit: 1000000000
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx384m"
    healthcheck:
      test: ["CMD", "true"]
  game-service:
    image: busybox
    restart: unless-stopped
    mem_limit: 1000000000
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx384m"
    healthcheck:
      test: ["CMD", "true"]
  ratings-service:
    image: busybox
    restart: unless-stopped
    mem_limit: 1000000000
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx384m"
    healthcheck:
      test: ["CMD", "true"]
  postgres:
    image: busybox
    restart: unless-stopped
    mem_limit: 200000000
    healthcheck:
      test: ["CMD", "true"]

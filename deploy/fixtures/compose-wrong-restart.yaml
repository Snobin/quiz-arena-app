# Fixture for check-compose.test.mjs: valkey restarts always; caddy has no restart policy.
services:
  core-service:
    image: busybox
    restart: unless-stopped
    mem_limit: 640m
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx384m"
    healthcheck:
      test: ["CMD", "true"]
  game-service:
    image: busybox
    restart: unless-stopped
    mem_limit: 640m
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx384m"
    healthcheck:
      test: ["CMD", "true"]
  ratings-service:
    image: busybox
    restart: unless-stopped
    mem_limit: 640m
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx384m"
    healthcheck:
      test: ["CMD", "true"]
  valkey:
    image: busybox
    restart: always
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "true"]
  caddy:
    image: busybox
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "true"]

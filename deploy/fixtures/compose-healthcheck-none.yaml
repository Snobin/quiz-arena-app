# Fixture for check-compose.test.mjs: postgres disables its healthcheck with test: ["NONE"].
services:
  core-service:
    image: busybox
    restart: unless-stopped
    mem_limit: 640m
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx384m"
    healthcheck:
      test: ["CMD", "true"]
  game-service:
    image: busybox
    restart: unless-stopped
    mem_limit: 640m
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx384m"
    healthcheck:
      test: ["CMD", "true"]
  ratings-service:
    image: busybox
    restart: unless-stopped
    mem_limit: 640m
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx384m"
    healthcheck:
      test: ["CMD", "true"]
  postgres:
    image: busybox
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["NONE"]

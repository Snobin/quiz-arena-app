# Fixture for check-compose.test.mjs: passes every rule (a required variable exercises the placeholder).
services:
  caddy:
    image: busybox
    restart: unless-stopped
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "true"]
  core-service:
    image: busybox
    restart: unless-stopped
    mem_limit: 640m
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xmx384m"
    healthcheck:
      test: ["CMD", "true"]
  game-service:
    image: busybox
    restart: unless-stopped
    mem_limit: 640m
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx384m"
    healthcheck:
      test: ["CMD", "true"]
  ratings-service:
    image: busybox
    restart: unless-stopped
    mem_limit: 640m
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m"
    healthcheck:
      test: ["CMD", "true"]
  postgres:
    image: busybox
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "true"]
    environment:
      POSTGRES_PASSWORD: ${FIXTURE_PASSWORD:?set FIXTURE_PASSWORD}
  valkey:
    image: busybox
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "true"]

# Local-only override for running the Spring Boot services from the IDE (never used in prod).
#
#   docker compose -f deploy/compose.yaml -f deploy/compose.ide.yaml --env-file deploy/.env \
#     up -d --no-deps postgres valkey caddy
#
# - Postgres and Valkey are published on 127.0.0.1 only, on non-default ports so they never clash
#   with a Homebrew Postgres/Redis on the Mac.
# - Caddy proxies to the services running on the host (host.docker.internal), so the web app's
#   Vite proxy (-> Caddy :8080) and deploy/verify-local.sh keep working against the IDE processes.
# - Stop the service containers first (docker compose ... stop core-service game-service
#   ratings-service); `--no-deps` keeps Compose from starting them again.

services:
  postgres:
    ports:
      - "127.0.0.1:${IDE_POSTGRES_PORT:-55432}:5432"

  valkey:
    ports:
      - "127.0.0.1:${IDE_VALKEY_PORT:-56379}:6379"

  caddy:
    environment:
      CORE_UPSTREAM: host.docker.internal:8081
      GAME_UPSTREAM: host.docker.internal:8082
      RATINGS_UPSTREAM: host.docker.internal:8083
    extra_hosts:
      - "host.docker.internal:host-gateway"

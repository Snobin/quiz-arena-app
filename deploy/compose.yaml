# Minnal runtime: one Compose file for local and prod (AD-19).
#   docker compose -f deploy/compose.yaml --env-file deploy/.env up -d --wait
# Only Caddy publishes a port; everything else stays on the private Compose network,
# so /internal/** and /actuator/** are never reachable from outside.

name: minnal

# Rotate container logs so they cannot fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-service-defaults: &service-defaults
  restart: unless-stopped
  mem_limit: 640m
  logging: *logging

x-service-env: &service-env
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
  JAVA_TOOL_OPTIONS: -Xmx384m
  VALKEY_HOST: valkey
  VALKEY_PORT: "6379"
  VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set VALKEY_PASSWORD in deploy/.env}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  # Metrics push to Grafana Cloud (prod profile only; Story 7.3a). Unset = the push fails quietly, never the service.
  GRAFANA_OTLP_URL: ${GRAFANA_OTLP_URL:-}
  GRAFANA_OTLP_AUTHORIZATION: ${GRAFANA_OTLP_AUTHORIZATION:-}

services:
  caddy:
    image: caddy:2.11
    restart: unless-stopped
    logging: *logging
    mem_limit: 128m
    ports:
      - "${CADDY_HTTP_PORT:-8080}:8080"
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-:8080}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    # service_started, not service_healthy: one unhealthy service must not take the whole site down.
    depends_on:
      core-service:
        condition: service_started
      game-service:
        condition: service_started
      ratings-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 5

  core-service:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: services/core/Dockerfile
    environment:
      <<: *service-env
      SERVER_PORT: "8081"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: minnal
      CORE_DB_USER: core
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:?set CORE_DB_PASSWORD in deploy/.env}
      # Service token for /internal/** (AD-12). Unset = core boots but answers every internal call with 401.
      MINNAL_INTERNAL_TOKEN: ${MINNAL_INTERNAL_TOKEN:-}
      # Guest JWT signing key (AD-9): base64 of a PKCS#8 PEM RSA key. Empty under local = an ephemeral
      # key (guest tokens die with the container); empty under prod = core refuses to start.
      MINNAL_JWT_SIGNING_KEY: ${MINNAL_JWT_SIGNING_KEY:-}
      MINNAL_JWT_KEY_ID: ${MINNAL_JWT_KEY_ID:-}
      # Rotation: kid=base64(SPKI PEM),... published in the JWKS, never used to sign.
      MINNAL_JWT_EXTRA_PUBLIC_KEYS: ${MINNAL_JWT_EXTRA_PUBLIC_KEYS:-}
      # Sign in with Google (Story 2.1). Secrets come from deploy/.env only. Empty client id/secret =
      # core boots and answers /auth/google/start with 503.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Public URL of core's callback (must match the Authorized redirect URI in Google Cloud).
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:5173/api/core/v1/auth/google/callback}
      # Public URL of the PWA: where the browser lands after sign-in; also the one CORS origin that
      # may call refresh with cookies.
      WEB_URL: ${WEB_URL:-http://localhost:5173}
      # Comma-separated emails that get the ADMIN role (matched against a verified Google email).
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 90s
      retries: 5

  game-service:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: services/game/Dockerfile
    # Shutdown waits up to 5 min for live matches to finish (MatchDrain), plus a margin.
    stop_grace_period: 330s
    environment:
      <<: *service-env
      SERVER_PORT: "8082"
      # Sent as X-Internal-Token on POST core-service:8081/internal/question-sets.
      MINNAL_INTERNAL_TOKEN: ${MINNAL_INTERNAL_TOKEN:-}
      # core-service on the private network: POST /internal/question-sets when a pairing forms.
      MINNAL_CORE_URL: http://core-service:8081
      # core-service's JWKS on the private network (fetched lazily, on the first token).
      MINNAL_JWKS_URI: http://core-service:8081/api/core/v1/auth/jwks
    # service_started, not healthy: a core restart must not cascade (the JWKS is fetched lazily).
    depends_on:
      valkey:
        condition: service_healthy
      core-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 90s
      retries: 5

  ratings-service:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: services/ratings/Dockerfile
    environment:
      <<: *service-env
      SERVER_PORT: "8083"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: minnal
      RATINGS_DB_USER: ratings
      RATINGS_DB_PASSWORD: ${RATINGS_DB_PASSWORD:?set RATINGS_DB_PASSWORD in deploy/.env}
      # core-service's JWKS on the private network (fetched lazily, on the first token).
      MINNAL_JWKS_URI: http://core-service:8081/api/core/v1/auth/jwks
    # core-service: service_started, not healthy, so a core restart does not cascade.
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      core-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 90s
      retries: 5

  postgres:
    image: postgres:18
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    environment:
      POSTGRES_DB: minnal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:?set CORE_DB_PASSWORD in deploy/.env}
      RATINGS_DB_PASSWORD: ${RATINGS_DB_PASSWORD:?set RATINGS_DB_PASSWORD in deploy/.env}
    volumes:
      # Postgres 18 images keep PGDATA under /var/lib/postgresql/18/docker.
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP check: the temporary init server listens on the socket only, so this
      # passes only once init scripts have finished and the real server is up.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "minnal"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 10

  valkey:
    image: valkey/valkey:9.0
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set VALKEY_PASSWORD in deploy/.env}
    command: ["sh", "-c", "exec valkey-server /usr/local/etc/valkey/valkey.conf --requirepass \"$$VALKEY_PASSWORD\""]
    volumes:
      - ./valkey/valkey.conf:/usr/local/etc/valkey/valkey.conf:ro
      - valkeydata:/data
    healthcheck:
      # REDISCLI_AUTH keeps the password out of the process list.
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$VALKEY_PASSWORD\" valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  valkeydata:

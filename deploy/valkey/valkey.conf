# Valkey for Minnal (AD-15). AUTH password is passed on the command line from env.
# Key prefixes by owner: core:, game:, ratings: (streams use minnal.).
dir /data
appendonly yes
appendfsync everysec

# Stay under the 256m container limit; never evict (streams and state must not vanish silently).
maxmemory 200mb
maxmemory-policy noeviction
